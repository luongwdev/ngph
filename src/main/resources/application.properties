spring.application.name=Course_Management


# 1. CONFIG DATASOURCE (Đã giữ nguyên & sửa port/db của bạn)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/it211_project?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=phuongxgai!

# 2. CONFIG JPA & HIBERNATE (Giữ nguyên của bạn)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# 3. CONFIG MULTIPART (Giới hạn File Upload tối đa 15MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# 4. CONFIG JWT (Dùng cho Authenticate & Token Lifecycle)
